<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>simple-memo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#23352a;font:16px system-ui,sans-serif}main{max-width:760px;margin:8vh auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}h1{font-size:32px;letter-spacing:-1px;margin:0}p{color:#647268}section,article{background:white;border:1px solid #dce3da;border-radius:16px;padding:24px;margin:16px 0}label{display:block;margin:16px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #c5d0c3;border-radius:8px;font:inherit}textarea{min-height:150px;resize:vertical}button{padding:11px 20px;border:0;border-radius:8px;background:#315c43;color:white;font:inherit;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:#e8eee6;color:#315c43}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91af70;outline-offset:2px}[hidden]{display:none!important}#status{min-height:24px;white-space:pre-wrap}#account{font-size:14px;overflow-wrap:anywhere}.content{white-space:pre-wrap;overflow-wrap:anywhere;color:#23352a}time{font-size:13px;color:#647268}.delete{float:right;background:#f3e9e6;color:#8a4935}footer{font-size:13px;color:#7c897d;margin-top:32px}@media(max-width:600px){main{margin:3vh auto;padding:16px}header{align-items:flex-start;gap:16px}}.ql-snow .ql-picker.ql-size .ql-picker-label[data-value]::before,.ql-snow .ql-picker.ql-size .ql-picker-item[data-value]::before{content:attr(data-value)!important}.ql-toolbar{border-radius:8px 8px 0 0}.ql-container{font:16px system-ui}.ql-editor{min-height:180px;color:#23352a}.ql-editor p{color:inherit}.content.ql-editor{min-height:0;padding:16px 0;white-space:normal}.ql-snow .ql-picker.ql-size{width:76px}.editor-help{font-size:13px} .memo-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.memo-actions{display:flex;gap:6px}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:8px;margin:0;background:#e8eee6;color:#315c43}.icon-button.danger{background:#f3e9e6;color:#8a4935}.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.memo-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;max-height:3.2em;margin:14px 0;color:#23352a}.memo-expand{display:flex;justify-content:flex-end}article.is-editing{outline:2px solid #86a477} </style>
<main><header><div><h1>simple-memo<span style="color:#86a477">.</span></h1><p>작은 생각을 안전하게 담아두세요.</p></div><button id="logout" class="secondary" hidden>로그아웃</button></header><div id="status" role="status" aria-live="polite"></div>
<section id="auth"><h2>나만의 메모장</h2><form id="authForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><p>비밀번호는 8자 이상 입력하세요.</p><button type="submit">로그인</button><a href="signup.html" style="display:inline-block;padding:11px 20px;color:#315c43">회원가입</a></form></section>
<div id="workspace" hidden><p id="account"></p><section><form id="memoForm"><label id="editorLabel" for="memo">새 메모</label><div id="memo"></div><p class="editor-help">글자 크기·색상을 선택하거나 Word·웹페이지의 서식 있는 텍스트를 붙여넣으세요. 최대 10,000자 · 이미지 제외</p><button id="saveMemo" type="submit">메모 저장</button><button id="cancelEdit" type="button" class="secondary" hidden>수정 취소</button></form></section><h2>내 메모 <span id="count"></span></h2><div id="list"></div></div><footer>simple-memo · 나만 볼 수 있는 기록</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script><script>
const Size=Quill.import('attributors/style/size');Size.whitelist=['10px','12px','14px','16px','18px','20px','24px','28px','32px','36px','48px','72px'];Quill.register(Size,true);
const Color=Quill.import('attributors/style/color');Quill.register(Color,true);
const editor=new Quill('#memo',{theme:'snow',placeholder:'지금 떠오른 생각은 무엇인가요?',formats:['bold','italic','underline','strike','size','color','background','header','list','align','indent','link'],modules:{toolbar:[[{size:[false,...Size.whitelist]}],[{color:[]},{background:[]}],['bold','italic','underline','strike'],[{list:'ordered'},{list:'bullet'}],[{align:[]}],['link','clean']]}});
Size.whitelist=null;editor.root.setAttribute('aria-label','새 메모 내용');
function safeHTML(html){return DOMPurify.sanitize(html,{ALLOWED_TAGS:['p','div','span','strong','b','em','i','u','s','br','ol','ul','li','a','h1','h2','h3','h4','h5','h6'],ALLOWED_ATTR:['style','href','class','data-list','target','rel'],ALLOW_DATA_ATTR:false});}
DOMPurify.addHook('uponSanitizeAttribute',(node,data)=>{if(data.attrName==='style'){const probe=document.createElement('span');probe.style.cssText=data.attrValue;data.attrValue=['color','background-color','font-size','font-weight','font-style','text-decoration','text-align'].map(k=>{const v=probe.style.getPropertyValue(k);return v&&!/url|expression|var\(/i.test(v)?k+':'+v:''}).filter(Boolean).join(';')}if(data.attrName==='class'){data.attrValue=data.attrValue.split(/\s+/).filter(c=>/^ql-(align-(center|right|justify)|indent-[1-8]|direction-rtl)$/.test(c)).join(' ')}});
const db=supabase.createClient('https://jtdmsobwehlfpwzfaprc.supabase.co','sb_publishable_5OPv3v1_Mdmgymp7p__SIQ_aPvjFr5l');
const $=id=>document.getElementById(id);let user=null,busy=false,version=0,editingId=null;
function status(t){$('status').textContent=t}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){status(e.message||'요청에 실패했습니다. 다시 시도하세요.')}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}

const icons={edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',expand:'<path d="m6 9 6 6 6-6"/>',collapse:'<path d="m6 15 6-6 6 6"/>'};
function iconButton(label,type){const b=document.createElement('button');b.type='button';b.className='icon-button'+(type==='trash'?' danger':'');b.title=label;b.setAttribute('aria-label',label);b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[type]+'</svg>';return b}
function resetEditor(){editingId=null;editor.setText('');$('editorLabel').textContent='새 메모';$('saveMemo').textContent='메모 저장';$('cancelEdit').hidden=true;document.querySelectorAll('article.is-editing').forEach(a=>a.classList.remove('is-editing'))}
$('cancelEdit').onclick=()=>{resetEditor();status('수정을 취소했습니다.')};
async function list(){const v=++version;const {data,error}=await db.from('memos').select('id,content,content_html,created_at').order('created_at',{ascending:false});if(error)throw error;if(v!==version||!user)return;$('list').replaceChildren();$('count').textContent='('+data.length+')';if(!data.length){$('list').textContent='아직 메모가 없습니다. 첫 기록을 남겨보세요.';return}
for(const m of data){const a=document.createElement('article'),head=document.createElement('div'),actions=document.createElement('div'),p=document.createElement('div'),preview=document.createElement('div'),t=document.createElement('time'),moreRow=document.createElement('div');
head.className='memo-head';actions.className='memo-actions';preview.className='memo-preview';preview.textContent=m.content;p.className='content ql-editor';p.hidden=true;p.id='memo-body-'+m.id;
if(m.content_html){p.innerHTML=safeHTML(m.content_html)}else{p.textContent=m.content;p.style.whiteSpace='pre-wrap'}
t.dateTime=m.created_at;t.textContent=new Date(m.created_at).toLocaleString('ko-KR');
const edit=iconButton('메모 수정','edit'),del=iconButton('메모 삭제','trash'),more=iconButton('전체 내용 보기','expand');more.setAttribute('aria-expanded','false');more.setAttribute('aria-controls',p.id);
more.onclick=()=>{const expanded=more.getAttribute('aria-expanded')!=='true';more.setAttribute('aria-expanded',String(expanded));more.setAttribute('aria-label',expanded?'내용 접기':'전체 내용 보기');more.title=expanded?'내용 접기':'전체 내용 보기';more.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[expanded?'collapse':'expand']+'</svg>';preview.hidden=expanded;p.hidden=!expanded};
edit.onclick=()=>{if(busy)return;editingId=m.id;document.querySelectorAll('article.is-editing').forEach(x=>x.classList.remove('is-editing'));a.classList.add('is-editing');if(m.content_html){editor.setContents(editor.clipboard.convert({html:safeHTML(m.content_html)}))}else{editor.setText(m.content)}$('editorLabel').textContent='메모 수정';$('saveMemo').textContent='수정 저장';$('cancelEdit').hidden=false;$('memoForm').scrollIntoView({behavior:'smooth',block:'start'});editor.focus();status('내용을 수정한 뒤 수정 저장을 눌러주세요.')};
del.onclick=()=>run(async()=>{const {data,error}=await db.from('memos').delete().eq('id',m.id).select('id');if(error)throw error;if(!data.length)throw Error('메모를 삭제할 수 없습니다.');if(editingId===m.id)resetEditor();await list();status('메모를 삭제했습니다.')});
actions.append(edit,del);head.append(t,actions);moreRow.className='memo-expand';moreRow.append(more);a.append(head,preview,p,moreRow);$('list').append(a)}}
async function render(session){user=session?.user||null;$('auth').hidden=!!user;$('workspace').hidden=!user;$('logout').hidden=!user;$('password').value='';$('list').replaceChildren();if(user){$('account').textContent=user.email;await list()}else{++version;resetEditor();$('account').textContent=''}}
$('authForm').onsubmit=e=>{e.preventDefault();run(async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await render(data.session);status('로그인했습니다.')})};
$('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;await render(null);status('로그아웃했습니다.')});
$('memoForm').onsubmit=e=>{e.preventDefault();run(async()=>{const content=editor.getText().trim();if(!content)throw Error('메모 내용을 입력하세요.');if([...content].length>10000)throw Error('메모는 10,000자까지 저장할 수 있습니다.');const content_html=safeHTML(editor.getSemanticHTML());if(new TextEncoder().encode(content_html).length>200000)throw Error('서식이 너무 많습니다. 서식 지우기 후 다시 저장하세요.');const wasEditing=!!editingId;let result;if(wasEditing){result=await db.from('memos').update({content,content_html}).eq('id',editingId).select('id')}else{result=await db.from('memos').insert({content,content_html,user_id:user.id}).select('id')}if(result.error)throw result.error;if(!result.data?.length)throw Error('메모를 저장할 수 없습니다. 다시 로그인해주세요.');resetEditor();await list();status(wasEditing?'메모를 수정했습니다.':'메모를 저장했습니다.')})};
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){render(null)}else if(event==='TOKEN_REFRESHED'){user=session?.user||null}});
run(async()=>{const {data,error}=await db.auth.getSession();if(error)throw error;await render(data.session)});
</script></html>
