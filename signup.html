<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 · simple-memo</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#23352a;font:16px system-ui,sans-serif}main{max-width:760px;margin:8vh auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}h1{font-size:32px;letter-spacing:-1px;margin:0}p{color:#647268}section,article{background:white;border:1px solid #dce3da;border-radius:16px;padding:24px;margin:16px 0}label{display:block;margin:16px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #c5d0c3;border-radius:8px;font:inherit}textarea{min-height:150px;resize:vertical}button{padding:11px 20px;border:0;border-radius:8px;background:#315c43;color:white;font:inherit;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:#e8eee6;color:#315c43}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91af70;outline-offset:2px}[hidden]{display:none!important}#status{min-height:24px;white-space:pre-wrap}#account{font-size:14px;overflow-wrap:anywhere}.content{white-space:pre-wrap;overflow-wrap:anywhere;color:#23352a}time{font-size:13px;color:#647268}.delete{float:right;background:#f3e9e6;color:#8a4935}footer{font-size:13px;color:#7c897d;margin-top:32px}@media(max-width:600px){main{margin:3vh auto;padding:16px}header{align-items:flex-start;gap:16px}}</style><main><header><div><h1>simple-memo<span style="color:#86a477">.</span></h1><p>작은 생각을 안전하게 담아두세요.</p></div><a href="./">로그인으로</a></header><div id="status" role="status" aria-live="polite"></div><section><h2>회원가입</h2><p>이메일 인증 없이 가입 후 바로 시작합니다.</p><form id="signupForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><p>다른 서비스와 다른 비밀번호를 8자 이상 입력하세요.</p><button id="submit" type="submit">가입하고 시작하기</button></form><p>이미 계정이 있나요? <a href="./">로그인</a></p></section><footer>simple-memo · 나만 볼 수 있는 기록</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>
const db=supabase.createClient('https://jtdmsobwehlfpwzfaprc.supabase.co','sb_publishable_5OPv3v1_Mdmgymp7p__SIQ_aPvjFr5l');
const $=id=>document.getElementById(id);let busy=false;
$('signupForm').onsubmit=async e=>{e.preventDefault();if(busy)return;if($('password').value!==$('confirmPassword').value){$('status').textContent='비밀번호가 일치하지 않습니다.';return}busy=true;$('submit').disabled=true;$('status').textContent='가입 중입니다…';try{const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data.session)throw Error('가입을 완료할 수 없습니다. 이미 가입한 이메일이면 로그인해주세요.');$('password').value='';$('confirmPassword').value='';location.replace('./')}catch(e){$('status').textContent=e.message||'가입하지 못했습니다. 다시 시도하세요.'}finally{busy=false;$('submit').disabled=false}};
</script></html>
